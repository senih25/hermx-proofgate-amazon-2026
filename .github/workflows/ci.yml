name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: node --version  # preinstalled on the runner; used by the parity test
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Unit, safety and Python/JS parity tests
        run: pytest -q
      - name: End-to-end MCP conformance over Streamable HTTP
        env:
          PROOFGATE_RUNTIME: ${{ runner.temp }}/proofgate
        run: |
          python server.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8767/health && break; sleep 1; done
          python demo_flow.py --url http://127.0.0.1:8767/mcp
